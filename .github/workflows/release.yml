# Pushing a tag like v0.5.0 builds the app for NextUI, CrossMix and Knulli
# with that version and publishes them, with their checksums, as a GitHub
# release, with the NextUI pak's zip for the Pak Store. Boombrick's Settings
# offers the latest release as an update, and the Pak Store the version
# pak.json names, so a full release's tag must match it. A tag with a suffix,
# like v0.5.0-beta.1, is a beta: a pre-release, which GitHub's latest release,
# and so Settings, leaves out, as does the Pak Store.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pak Store version
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          v="$(jq -r .version pak.json)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "pak.json says $v, the tag is $GITHUB_REF_NAME" >&2; exit 1; }
      # The Makefile builds the toolchain image with the Go that go.mod asks for.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # The toolchain's container writes as root; folders made first stay the
      # runner's, so the steps after it can write beside what it built.
      - name: Build
        run: |
          mkdir -p dist/tg5040 dist/qjs
          make pak crossmix knulli VERSION="${GITHUB_REF_NAME#v}"
      - name: Checksums
        working-directory: dist
        run: sha256sum Boombrick.pak.zip Boombrick-CrossMix.zip Boombrick-Knulli.zip Boombrick-PakStore.zip > SHA256SUMS
      # The notes are the tag's section of CHANGELOG.md, from its "## [v…]"
      # heading to the next, with the coffee link after it; GitHub's own when
      # there is none.
      - name: Release notes
        run: |
          awk -v head="## [$GITHUB_REF_NAME]" '
            index($0, "## [") == 1 { if (on) exit; on = ($0 == head); next }
            on
          ' CHANGELOG.md > dist/NOTES.md
          if grep -q '[^[:space:]]' dist/NOTES.md; then
            printf "\nBoombrick is free. If you'd like to help keep it going, you can [buy me a coffee](https://buymeacoffee.com/ujjwal_).\n" >> dist/NOTES.md
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--notes-file dist/NOTES.md"
          grep -q '[^[:space:]]' dist/NOTES.md || flags="--generate-notes"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/Boombrick.pak.zip dist/Boombrick-CrossMix.zip dist/Boombrick-Knulli.zip dist/Boombrick-PakStore.zip dist/SHA256SUMS \
            --title "Boombrick ${GITHUB_REF_NAME#v}" $flags
